[package]
name = "chatbrowserx-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
erased-serde = "0.4.11"
futures-util = "0.3.34"
hmac = "0.13.0"
libc = "0.2.191"
log = { version = "0.4.34", features = ["std", "kv_serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
agora-sandbox = { git = "https://github.com/nullptrpanic/agora.git", rev = "bb5a9999c2ddd0ed492e40fa8117b7757c653233", default-features = false, features = ["remote-smb"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = "0.5.3"
