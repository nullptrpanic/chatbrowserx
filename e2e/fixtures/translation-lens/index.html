<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Translation lens feasibility</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f3f6fb;
      color: #172642;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: auto;
      padding: 48px 40px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 18px;
    }
    p {
      font-size: 20px;
      margin: 0 0 36px;
    }
    canvas {
      display: block;
      width: 100%;
      border-radius: 18px;
    }
    #lens,
    #translations {
      position: fixed;
      pointer-events: none;
    }
    #lens {
      border: 1.5px solid #769dea;
      border-radius: 16px;
      box-shadow: 0 4px 24px #21386224;
    }
    #translations {
      inset: 0;
    }
    #translations span {
      position: absolute;
      white-space: nowrap;
      line-height: 1;
    }
  </style>
  <main>
    <h1>A lens for translated reading</h1>
    <p>Move the lens across this page.</p>
    <canvas width="1100" height="430"></canvas>
  </main>
  <script type="module">
    import { parseTranslation, projectBox } from './lens.ts';
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 1100, 215);
    const gradient = ctx.createLinearGradient(0, 215, 1100, 430);
    gradient.addColorStop(0, '#123b64');
    gradient.addColorStop(1, '#397d8f');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 215, 1100, 215);
    ctx.strokeStyle = '#ffffff18';
    for (let x = 0; x < 1100; x += 45) {
      ctx.beginPath();
      ctx.moveTo(x, 215);
      ctx.lineTo(x + 130, 430);
      ctx.stroke();
    }
    const rows = [
      ['Start a new project', 80, '#172642'],
      ['Your changes are saved automatically.', 140, '#172642'],
      ['Review before publishing', 300, '#ffffff'],
      ['Keep your team informed.', 360, '#ffffff'],
    ];
    const truth = [];
    ctx.font = '28px Arial';
    for (const [text, y, color] of rows) {
      ctx.fillStyle = color;
      ctx.fillText(text, 64, y);
      const m = ctx.measureText(text);
      truth.push({
        text,
        box: [
          64 - m.actualBoundingBoxLeft,
          y - m.actualBoundingBoxAscent,
          m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
          m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
        ],
      });
    }
    // Independent layout evidence; the model sees the screenshot, never this array.
    window.fixtureRects = () => {
      const rect = canvas.getBoundingClientRect();
      const scale = rect.width / canvas.width;
      return truth.map(({ text, box }) => ({
        text,
        box: [
          rect.left + box[0] * scale,
          rect.top + box[1] * scale,
          box[2] * scale,
          box[3] * scale,
        ],
      }));
    };
    if (new URLSearchParams(location.search).has('preview')) {
      const response = await fetch('./translation.json');
      if (!response.ok) throw new Error('Run the real model sample before previewing.');
      const record = await response.json();
      const blocks = parseTranslation(JSON.stringify(record));
      const layer = document.createElement('div');
      layer.id = 'translations';
      const lens = document.createElement('div');
      lens.id = 'lens';
      function layoutTranslations() {
        layer.replaceChildren();
        for (const block of blocks) {
          const box = projectBox(block.box, record.viewport[0], record.viewport[1]);
          const node = document.createElement('span');
          const dom = [...document.querySelectorAll('h1,p')].find(
            (el) => el.textContent === block.text,
          );
          const rect = dom?.getBoundingClientRect();
          const cr = canvas.getBoundingClientRect();
          const ratio = cr.width / record.canvasBox[2];
          const padding = 4 * ratio;
          box.left = cr.left + (box.left - record.canvasBox[0]) * ratio;
          box.top = cr.top + (box.top - record.canvasBox[1]) * ratio;
          box.width *= ratio;
          box.height *= ratio;
          const size = rect
            ? {
                left: rect.left,
                top: rect.top,
                width: rect.width,
                height: rect.height,
              }
            : {
                left: box.left - padding,
                top: box.top - padding,
                width: box.width + padding * 2,
                height: box.height + padding * 2,
              };
          Object.assign(
            node.style,
            Object.fromEntries(Object.entries(size).map(([k, v]) => [k, `${v}px`])),
          );
          if (!dom) node.style.padding = `${padding}px`;
          const sx = Math.max(
            0,
            Math.min(1099, Math.floor(((box.left - cr.left - 2) * 1100) / cr.width)),
          );
          const sy = Math.max(
            0,
            Math.min(429, Math.floor(((box.top - cr.top - 2) * 430) / cr.height)),
          );
          const pixel = ctx.getImageData(sx, sy, 1, 1).data;
          node.style.background = dom ? '#f3f6fb' : `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
          node.style.color = dom || sy < 215 ? '#172642' : '#fff';
          node.style.fontSize = dom ? getComputedStyle(dom).fontSize : `${box.height}px`;
          node.textContent = block.translation;
          layer.append(node);
        }
      }
      document.body.append(layer, lens);
      let point = { x: innerWidth / 2, y: 320 },
        scale = 1,
        frame = 0,
        layoutDirty = true;
      function draw() {
        frame = 0;
        if (layoutDirty) {
          layoutTranslations();
          layoutDirty = false;
        }
        const width = Math.min(innerWidth - 16, 520 * scale),
          height = Math.min(innerHeight - 16, 230 * scale);
        const left = Math.max(8, Math.min(innerWidth - width - 8, point.x - width / 2));
        const top = Math.max(8, Math.min(innerHeight - height - 8, point.y - height / 2));
        Object.assign(lens.style, {
          left: `${left}px`,
          top: `${top}px`,
          width: `${width}px`,
          height: `${height}px`,
        });
        layer.style.clipPath = `inset(${top}px ${innerWidth - left - width}px ${innerHeight - top - height}px ${left}px round 16px)`;
      }
      function schedule() {
        if (!frame) frame = requestAnimationFrame(draw);
      }
      const relayout = () => {
        layoutDirty = true;
        schedule();
      };
      const observer = new ResizeObserver(relayout);
      observer.observe(document.querySelector('main'));
      observer.observe(canvas);
      const move = (e) => {
        point = { x: e.clientX, y: e.clientY };
        schedule();
      };
      const zoom = (e) => {
        if (!e.ctrlKey) return;
        e.preventDefault();
        scale = Math.max(0.5, Math.min(2, scale * Math.exp(-e.deltaY * 0.005)));
        schedule();
      };
      const stop = (e) => {
        if (e.key !== 'Escape') return;
        cancelAnimationFrame(frame);
        lens.remove();
        layer.remove();
        observer.disconnect();
        removeEventListener('resize', relayout);
        removeEventListener('scroll', relayout, true);
        visualViewport?.removeEventListener('resize', relayout);
        visualViewport?.removeEventListener('scroll', relayout);
        removeEventListener('pointermove', move);
        removeEventListener('wheel', zoom);
        removeEventListener('keydown', stop);
      };
      addEventListener('pointermove', move);
      addEventListener('wheel', zoom, { passive: false });
      addEventListener('keydown', stop);
      addEventListener('resize', relayout);
      addEventListener('scroll', relayout, true);
      visualViewport?.addEventListener('resize', relayout);
      visualViewport?.addEventListener('scroll', relayout);
      draw();
    }
  </script>
</html>
